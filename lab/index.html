<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경호 업무 비서</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/owner.js"></script>
<script src="assets/lock.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffc531">
<script src="assets/layout.js"></script>
</head>
<body>
<div class="wrap">
  <div class="dash">
    <!-- 인사 + 바로가기 -->
    <section class="hero">
      <div class="hero-top">
        <div>
          <h1 id="greet">경호님, 좋은 하루 되세요! 👋</h1>
          <p>반복되는 엑셀 일은 여기서 버튼 몇 번으로 끝내요.</p>
        </div>
        <span class="pill" id="toolCount"></span>
      </div>
      <div class="quick" id="quick"></div>
    </section>

    <!-- 오늘 요약 -->
    <section class="card info">
      <h3>오늘 요약</h3>
      <div class="big" id="leftCount">0<small>개</small></div>
      <div class="info-sub">남은 할 일</div>
      <div class="kv"><span>가장 가까운 일정</span><b id="nextEvent">-</b></div>
      <div class="kv"><span>이번 주 끝낸 일</span><b id="weekDone">0개</b></div>
      <div class="kv"><span>근속</span><b id="career"><button type="button" id="setJoin" style="padding:4px 10px;font-size:12px">입사일 넣기</button></b></div>
      <div class="kv hidden" id="joinRow"><span>입사일</span><b class="row-form"><input type="date" id="joinDate"><button type="button" id="saveJoin" class="primary" style="padding:6px 12px">저장</button></b></div>
    </section>

    <!-- 왼쪽: 할일 + 메모 -->
    <div class="dash-col">
      <section class="card box">
        <div class="card-title"><h3>오늘의 할일</h3><small id="todoSummary"></small></div>
        <p class="card-desc">할 일을 적고, 끝나면 체크해요.</p>
        <form class="row-form" id="todoForm">
          <input type="text" class="grow" id="todoText" placeholder="할 일을 입력하세요 (예: 이시아 행사 리스트 사장님께 보내기)" maxlength="120" required>
          <select id="todoPri" aria-label="중요도">
            <option value="2">🟡 보통</option>
            <option value="1">🔴 중요</option>
            <option value="3">⚪ 낮음</option>
          </select>
          <input type="date" id="todoDue" aria-label="날짜">
          <button class="primary" type="submit">＋ 추가</button>
        </form>
        <div class="tabs" id="todoTabs">
          <button type="button" data-f="open" class="on">할 일</button>
          <button type="button" data-f="done">끝낸 일</button>
          <button type="button" data-f="all">전체</button>
        </div>
        <ul class="todo" id="todoList"></ul>
      </section>

      <section class="card box">
        <div class="card-title"><h3>빠른 메모</h3><small id="memoSaved"></small></div>
        <p class="card-desc">적으면 자동으로 저장돼요.</p>
        <textarea class="memo" id="memo" maxlength="1000" placeholder="잊으면 안 되는 거, 전화번호, 품번 같은 걸 적어 두세요."></textarea>
        <div class="memo-foot"><span>이 컴퓨터에만 저장돼요</span><span id="memoLen">0/1000</span></div>
      </section>
    </div>

    <!-- 오른쪽: 일정 + 링크 -->
    <div class="dash-col">
      <section class="card box">
        <div class="card-title"><h3>다가오는 일정</h3></div>
        <p class="card-desc">행사 세팅·철수 같은 날을 넣어 두면 D-day로 보여줘요.</p>
        <form class="small-form" id="schedForm" style="margin-bottom:10px">
          <input type="date" id="schedDate" required aria-label="날짜" style="flex:0 0 140px">
          <input type="text" id="schedTitle" placeholder="일정 이름" maxlength="60" required>
          <button class="primary" type="submit">추가</button>
        </form>
        <ul class="sched" id="schedList"></ul>
      </section>

      <section class="card box">
        <div class="card-title"><h3>자주 쓰는 링크</h3></div>
        <div class="links" id="links"></div>
        <form class="small-form" id="linkForm">
          <input type="text" id="linkName" placeholder="이름" maxlength="30" required>
          <input type="url" id="linkUrl" placeholder="https://" required>
          <button type="submit">추가</button>
        </form>
      </section>
    </div>
  </div>

  <footer>made by 경호 &amp; 루나 🐯</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = new Date(); today.setHours(0, 0, 0, 0);
const TODAY = ymd(today);
const dayDiff = s => Math.round((new Date(s + 'T00:00:00') - today) / 86400000);
const ddayText = n => n === 0 ? 'D-DAY' : n > 0 ? `D-${n}` : `D+${-n}`;
const md = s => { const [, m, d] = s.split('-'); const w = ['일','월','화','수','목','금','토'][new Date(s + 'T00:00:00').getDay()]; return `${+m}/${+d} (${w})`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* 인사 + 바로가기 */
const h = new Date().getHours();
$('greet').textContent = h < 11 ? '경호님, 좋은 아침이에요! ☀️' : h < 14 ? '경호님, 점심 맛있게 드세요! 🍚' : h < 18 ? '경호님, 오후도 힘내요! 💪' : '경호님, 오늘도 수고 많았어요! 🌙';
const ready = TOOLS.filter(t => t.ready);
$('toolCount').textContent = `도구 ${ready.length}개 사용가능`;
$('quick').innerHTML = TOOLS.map(t => t.ready
  ? `<a href="${t.href}"><b>${t.icon} ${esc(t.name)}</b><span class="tag ready">사용가능</span></a>`
  : `<a style="opacity:.6;cursor:default"><b>${t.icon} ${esc(t.name)}</b><span class="tag">준비중</span></a>`).join('');

/* 할일 */
let todos = Store.get('todos', []);
let filter = 'open';
function saveTodos() { Store.set('todos', todos); renderTodos(); renderSummary(); }
function renderTodos() {
  const list = todos
    .filter(t => filter === 'all' || (filter === 'done' ? t.done : !t.done))
    .sort((a, b) => (a.done - b.done) || (a.pri - b.pri) || ((a.due || '9999') < (b.due || '9999') ? -1 : 1));
  $('todoList').innerHTML = list.length ? list.map(t => {
    const n = t.due ? dayDiff(t.due) : null;
    const when = t.due ? `${md(t.due)}${!t.done && n < 0 ? ' · 지남' : !t.done && n === 0 ? ' · 오늘' : ''}` : '';
    return `<li class="${t.done ? 'done' : ''}" data-id="${t.id}">
      <input type="checkbox" ${t.done ? 'checked' : ''} aria-label="끝냄">
      <span class="dot p${t.pri}"></span>
      <span class="txt">${esc(t.text)}</span>
      <span class="when" style="${!t.done && n !== null && n <= 0 ? 'color:var(--danger);font-weight:600' : ''}">${when}</span>
      <button class="del" type="button" aria-label="지우기">×</button></li>`;
  }).join('') : `<li class="empty-note">${filter === 'done' ? '아직 끝낸 일이 없어요.' : '할 일이 없어요. 오늘은 여유롭네요 ☕'}</li>`;
  const open = todos.filter(t => !t.done).length;
  $('todoSummary').textContent = `남은 일 ${open}개 · 끝낸 일 ${todos.length - open}개`;
}
$('todoForm').addEventListener('submit', e => {
  e.preventDefault();
  const text = $('todoText').value.trim();
  if (!text) return;
  todos.push({ id: uid(), text, pri: +$('todoPri').value, due: $('todoDue').value, done: false, doneAt: null });
  $('todoText').value = ''; $('todoDue').value = '';
  saveTodos();
});
$('todoList').addEventListener('click', e => {
  const li = e.target.closest('li[data-id]'); if (!li) return;
  const t = todos.find(x => x.id === li.dataset.id); if (!t) return;
  if (e.target.matches('input[type=checkbox]')) { t.done = e.target.checked; t.doneAt = t.done ? TODAY : null; saveTodos(); }
  if (e.target.matches('.del')) { todos = todos.filter(x => x.id !== t.id); saveTodos(); }
});
$('todoTabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  [...$('todoTabs').children].forEach(x => x.classList.toggle('on', x === b));
  renderTodos();
});

/* 일정 */
let scheds = Store.get('schedules', []);
function saveScheds() { Store.set('schedules', scheds); renderScheds(); renderSummary(); }
function renderScheds() {
  const list = scheds.filter(s => dayDiff(s.date) >= -3).sort((a, b) => a.date < b.date ? -1 : 1);
  $('schedList').innerHTML = list.length ? list.map(s => {
    const n = dayDiff(s.date);
    return `<li data-id="${s.id}"><span class="d">${md(s.date)}</span><span class="t">${esc(s.title)}</span>
      <span class="dday ${n === 0 ? 'today' : n < 0 ? 'past' : ''}">${ddayText(n)}</span>
      <button class="del" type="button" aria-label="지우기" style="border:none;background:none;color:var(--sub);padding:0 4px">×</button></li>`;
  }).join('') : '<li class="empty-note">아직 일정이 없어요. 위에서 추가해 보세요!</li>';
}
$('schedForm').addEventListener('submit', e => {
  e.preventDefault();
  scheds.push({ id: uid(), date: $('schedDate').value, title: $('schedTitle').value.trim() });
  $('schedTitle').value = '';
  saveScheds();
});
$('schedList').addEventListener('click', e => {
  if (!e.target.matches('button')) return;
  const id = e.target.closest('li').dataset.id;
  scheds = scheds.filter(s => s.id !== id); saveScheds();
});

/* 메모 */
const memo = $('memo');
memo.value = Store.get('memo', '');
$('memoLen').textContent = `${memo.value.length}/1000`;
let memoTimer;
memo.addEventListener('input', () => {
  $('memoLen').textContent = `${memo.value.length}/1000`;
  $('memoSaved').textContent = '저장 중…';
  clearTimeout(memoTimer);
  memoTimer = setTimeout(() => { Store.set('memo', memo.value); $('memoSaved').textContent = '저장됨 ✓'; }, 400);
});

/* 링크 */
let links = Store.get('links', null);
if (!links) {
  links = [
    { id: uid(), name: 'BUYEST', url: 'https://www.buyest.co.kr' },
    { id: uid(), name: 'BUYEST Toolkit', url: 'https://buyestkorea-code.github.io' },
    { id: uid(), name: '이카운트', url: 'https://login.ecount.com' },
    { id: uid(), name: '내 깃허브 저장소', url: 'https://github.com/JKTIGER86/jktiger86.github.io' },
  ];
  Store.set('links', links);
}
function renderLinks() {
  $('links').innerHTML = links.length ? links.map(l => {
    let host = ''; try { host = new URL(l.url).hostname; } catch {}
    return `<a href="${esc(l.url)}" target="_blank" rel="noopener" data-id="${l.id}">🔗 <span>${esc(l.name)}<br><small style="color:var(--sub)">${esc(host)}</small></span><button class="x" type="button" aria-label="지우기">×</button></a>`;
  }).join('') : '<div class="empty-note">링크가 없어요.</div>';
}
$('links').addEventListener('click', e => {
  if (!e.target.matches('.x')) return;
  e.preventDefault();
  const id = e.target.closest('a').dataset.id;
  links = links.filter(l => l.id !== id); Store.set('links', links); renderLinks();
});
$('linkForm').addEventListener('submit', e => {
  e.preventDefault();
  let url = $('linkUrl').value.trim();
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  links.push({ id: uid(), name: $('linkName').value.trim(), url });
  Store.set('links', links);
  $('linkName').value = ''; $('linkUrl').value = '';
  renderLinks();
});

/* 오늘 요약 */
function renderSummary() {
  const open = todos.filter(t => !t.done).length;
  $('leftCount').innerHTML = `${open}<small>개</small>`;
  const next = scheds.filter(s => dayDiff(s.date) >= 0).sort((a, b) => a.date < b.date ? -1 : 1)[0];
  $('nextEvent').innerHTML = next ? `${esc(next.title)}<small>${ddayText(dayDiff(next.date))} · ${md(next.date)}</small>` : '-';
  const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  $('weekDone').textContent = todos.filter(t => t.done && t.doneAt && t.doneAt >= ymd(monday)).length + '개';
  const join = Store.get('joinDate', '');
  if (join) {
    const n = -dayDiff(join) + 1;
    const y = Math.floor(n / 365.25);
    $('career').innerHTML = `${n.toLocaleString('ko-KR')}일째<small>${y}년차 · <a href="#" id="editJoin">바꾸기</a></small>`;
    $('editJoin').addEventListener('click', e => { e.preventDefault(); $('joinDate').value = join; $('joinRow').classList.remove('hidden'); });
  }
}
$('setJoin').addEventListener('click', () => $('joinRow').classList.remove('hidden'));
$('saveJoin').addEventListener('click', () => {
  if (!$('joinDate').value) return;
  Store.set('joinDate', $('joinDate').value);
  $('joinRow').classList.add('hidden');
  renderSummary();
});

renderTodos(); renderScheds(); renderLinks(); renderSummary();
</script>
</body>
</html>
